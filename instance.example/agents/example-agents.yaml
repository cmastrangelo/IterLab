# Example agents. One agent per file; schema: iterlab.labs.spec.AgentSpec.
# Provisioned on startup as managed (read-only via the API) agents.

# --- CLI agent: a local command run by a worker ---
slug: claude-cli
name: Claude (CLI)
description: Runs the `claude` CLI. Needs the CLI installed on the worker host.
kind: cli
command: claude
args: []
working_dir: null

# --- CLI agent driving opencode against a specific model (put in its own file) ---
# `flavor: opencode` teaches IterLab how to run `opencode run` headlessly and
# resume its sessions. `model` is opencode's "provider/model" string and is
# pinned here, so you can add several opencode agents that differ only by model.
# slug: opencode-glm
# name: opencode · GLM-5.2
# kind: cli
# command: opencode
# flavor: opencode
# model: openrouter/z-ai/glm-5.2   # hosted via OpenRouter…
# # model: ollama/qwen2.5-coder    # …or an open model served locally, no API
# args: []

