# Example lab: a connected repo evaluated against an external SQL leaderboard.
slug: example-lab
name: Example Lab
description: >
  Template lab. Copy to instance/labs/, adjust, and it is provisioned on startup.

project_slug: instance
project_name: Instance

repo:
  url: git@github.com:you/your-project.git
  branch: main
  # credential_env: EXAMPLE_REPO_TOKEN

settings:
  baseline: main            # free-form; the lab's reference point
  goal: "improve the thing"

benchmarks:
  - slug: ladder
    name: Ladder
    description: 1000-game ranked ladder; result is win rate + ladder rank.
    adapter: sql_leaderboard
    primary_metric: win_pct
    higher_is_better: true
    spec:
      dsn_env: MY_LADDER_DSN
      title: "Example Ladder"
      query: >
        SELECT entrant, win_pct, rating, games
        FROM some_schema.some_ladder
        ORDER BY win_pct DESC
      entrant_column: entrant
      score_column: win_pct
      # baseline_column: is_baseline
      # updated_at_query: "SELECT max(updated_at) FROM some_schema.some_ladder"
      columns:
        - { key: win_pct, label: "Win %", kind: percent, primary: true }
        - { key: rating, label: "Rating", kind: number }
        - { key: games, label: "Games", kind: integer }

  # Rank this lab's candidates by a label a human records after the fact
  # (e.g. a real competition placement). No external DB — reads Candidate.labels.
  - slug: external-rank
    name: External ranking
    description: Manually-recorded outcome per candidate; ranked here.
    adapter: candidate_labels
    primary_metric: placement
    higher_is_better: false
    spec:
      label_key: placement          # which key in Candidate.labels to use
      title: "External ranking"
      value_label: Placement
      sort: tiered                  # numeric (default) | tiered | lexical
      tiers: [Legend, Gold, Silver, Bronze]   # best -> worst; tiered only
      within_tier_order: asc        # lower number = better inside a tier
      # order: asc                   # numeric/lexical: asc = smaller is better
      # baseline_names: [main]
      # extra_entrants:              # fixed reference rows (no candidate needed)
      #   - { entrant: main, value: "Gold 200", baseline: true }
